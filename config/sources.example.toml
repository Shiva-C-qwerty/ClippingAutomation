[project]
theme = "funny"
default_compilation_style = "top5"

[scoring]
preferred_duration_min = 5
preferred_duration_max = 25
max_candidate_age_days = 21
keywords = [
  "funny",
  "laugh",
  "lol",
  "fails",
  "meme",
  "instant regret",
  "cat",
  "dog",
  "prank",
]

[reddit]
enabled = true
user_agent = "ClippingAutomation/0.1 by replace-me"
limit_per_feed = 15

[[reddit.feeds]]
subreddit = "funnypets"
category = "animal"
sort = "top"
time = "week"

