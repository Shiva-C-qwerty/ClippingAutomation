[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping-automation"
version = "0.1.0"
description = "MVP workflow for discovering, approving, compiling, and uploading funny clips."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.170.0",
  "google-auth-oauthlib>=1.2.0",
  "numpy>=2.2.0",
  "requests>=2.32.0",
]

[project.scripts]
clipbot = "clipping_automation.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
