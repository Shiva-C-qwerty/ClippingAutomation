[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping-automation"
version = "0.1.0"
description = "MVP workflow for discovering, approving, compiling, and uploading funny clips."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "google-api-python-client>=2.170.0",
  "google-auth-oauthlib>=1.2.0",
  "jinja2>=3.1.6",
  "numpy>=2.2.0",
  "python-multipart>=0.0.20",
  "requests>=2.32.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
clipbot = "clipping_automation.cli:main"
clipbot-web = "clipping_automation.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clipping_automation" = ["templates/*.html", "static/*.css"]
